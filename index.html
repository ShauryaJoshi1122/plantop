<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plant Health AI | Shaurya Dev</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:linear-gradient(#138808,#fff,#ff9933);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.app{
background:white;
width:95%;
max-width:450px;
padding:20px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
text-align:center;
}

/* Header */

h1{
color:#138808;
margin-bottom:5px;
}

p{
font-size:14px;
color:#444;
}

/* Buttons */

.btn{
width:100%;
padding:15px;
margin:8px 0;
border:none;
border-radius:30px;
font-size:16px;
font-weight:600;
background:linear-gradient(to right,#ff9933,#fff,#138808);
cursor:pointer;
}

.btn:active{
transform:scale(0.98);
}

/* Preview */

#preview{
width:100%;
margin-top:15px;
border-radius:15px;
display:none;
}

/* Result */

#result{
margin-top:15px;
padding:15px;
border-radius:15px;
background:#f5f5f5;
display:none;
font-size:14px;
}

/* Footer */

.footer{
margin-top:15px;
font-size:12px;
color:#555;
}

.footer span{
color:#138808;
font-weight:600;
}

/* Hide Inputs */

input{
display:none;
}

</style>

</head>

<body>

<div class="app">

<h1>🌱 Plant Health AI</h1>
<p>Smart Farming for India 🇮🇳</p>


<!-- CAMERA -->
<button class="btn" onclick="openCamera()">📸 Open Camera</button>
<input type="file" id="camera" accept="image/*" capture="environment">


<!-- GALLERY -->
<button class="btn" onclick="openGallery()">🖼️ Open Gallery</button>
<input type="file" id="gallery" accept="image/*">


<img id="preview">


<button class="btn" onclick="analyze()">🔍 Check Health</button>


<div id="result"></div>


<div class="footer">
Made by <span>Shaurya Dev</span> ❤️
</div>

</div>


<script>

const apiKey="SCf1tCQX5w7UuDXoU8Tn8MacWc5A18IQErtCqrWhOhslUiBaPD";

let selectedImage=null;

const camera=document.getElementById("camera");
const gallery=document.getElementById("gallery");
const preview=document.getElementById("preview");
const result=document.getElementById("result");


/* Open Camera */
function openCamera(){
camera.click();
}

/* Open Gallery */
function openGallery(){
gallery.click();
}

/* Load Image */

camera.addEventListener("change",loadImage);
gallery.addEventListener("change",loadImage);

function loadImage(e){

const file=e.target.files[0];

if(!file) return;

selectedImage=file;

const reader=new FileReader();

reader.onload=function(){
preview.src=reader.result;
preview.style.display="block";
}

reader.readAsDataURL(file);

}


/* Analyze */

async function analyze(){

if(!selectedImage){
alert("Please take or select photo 📸");
return;
}

result.style.display="block";
result.innerHTML="⏳ Checking plant...";

const formData=new FormData();
formData.append("images",selectedImage);

try{

const res=await fetch("https://api.plant.id/v2/health_assessment",{
method:"POST",
headers:{
"Api-Key":apiKey
},
body:formData
});

const data=await res.json();

if(data.health_assessment && data.health_assessment.diseases.length>0){

let d=data.health_assessment.diseases[0];

result.innerHTML=`
<b>🌿 Disease:</b> ${d.name}<br>
<b>Confidence:</b> ${(d.probability*100).toFixed(1)}%<br><br>
<b>Advice:</b> ${d.treatment.biological[0] || "Contact Agriculture Officer"}
`;

}else{

result.innerHTML="✅ Plant is Healthy 🌱";

}

}catch(err){

result.innerHTML="⚠️ Internet / API Error";

}

}

</script>

</body>
</html>
