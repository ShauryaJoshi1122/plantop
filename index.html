<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plant Health AI | Shaurya Dev</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(to bottom,#138808,#ffffff,#ff9933);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:95%;
    max-width:420px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
}

h1{
    color:#138808;
}

.tagline{
    font-size:14px;
    color:#444;
    margin-bottom:20px;
}

/* Upload Box */

.upload-box{
    border:2px dashed #138808;
    padding:18px;
    border-radius:15px;
    cursor:pointer;
    margin-bottom:15px;
}

.upload-box:hover{
    background:#f0fff4;
}

input{
    display:none;
}

/* Preview */

#preview{
    width:100%;
    border-radius:15px;
    display:none;
    margin-bottom:15px;
}

/* Buttons */

.btn{
    width:100%;
    background:linear-gradient(to right,#ff9933,#ffffff,#138808);
    border:none;
    padding:12px;
    border-radius:25px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

.btn:hover{
    opacity:0.9;
}

/* Result */

#result{
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    background:#f8f8f8;
    display:none;
}

/* Footer */

.footer{
    margin-top:20px;
    font-size:12px;
    color:#555;
}

.footer span{
    color:#138808;
    font-weight:600;
}

</style>
</head>

<body>

<div class="container">

<h1>🌱 Plant Health AI</h1>
<p class="tagline">Smart Farming for India 🇮🇳</p>

<!-- CAMERA INPUT -->
<label class="upload-box">
📸 Open Camera
<input type="file" id="cameraInput" accept="image/*" capture="environment">
</label>

<!-- GALLERY INPUT -->
<label class="upload-box">
🖼️ Choose from Gallery
<input type="file" id="fileInput" accept="image/*">
</label>

<img id="preview">

<button class="btn" onclick="analyze()">🔍 Check Plant Health</button>

<div id="result"></div>

<div class="footer">
Developed by <span>Shaurya Dev</span> ❤️<br>
AI for Indian Farmers
</div>

</div>

<script>

const apiKey="SCf1tCQX5w7UuDXoU8Tn8MacWc5A18IQErtCqrWhOhslUiBaPD";

const cameraInput=document.getElementById("cameraInput");
const fileInput=document.getElementById("fileInput");
const preview=document.getElementById("preview");
const result=document.getElementById("result");

let selectedFile=null;

/* Camera */

cameraInput.addEventListener("change",function(){
    loadImage(this.files[0]);
});

/* Gallery */

fileInput.addEventListener("change",function(){
    loadImage(this.files[0]);
});

/* Load Image */

function loadImage(file){

    if(!file) return;

    selectedFile=file;

    const reader=new FileReader();

    reader.onload=function(){
        preview.src=reader.result;
        preview.style.display="block";
    }

    reader.readAsDataURL(file);
}

/* Analyze */

async function analyze(){

if(!selectedFile){
    alert("Please take or upload photo 📸");
    return;
}

result.style.display="block";
result.innerHTML="⏳ Checking plant health...";

const formData=new FormData();
formData.append("images",selectedFile);

try{

const res=await fetch("https://api.plant.id/v2/health_assessment",{
    method:"POST",
    headers:{
        "Api-Key":apiKey
    },
    body:formData
});

const data=await res.json();

if(data.health_assessment && data.health_assessment.diseases.length>0){

let disease=data.health_assessment.diseases[0];

result.innerHTML=`
<h3>🌿 Diagnosis</h3>
<p><b>Disease:</b> ${disease.name}</p>
<p><b>Confidence:</b> ${(disease.probability*100).toFixed(1)}%</p>
<p><b>Advice:</b> ${disease.treatment.biological[0] || "Consult agriculture officer"}</p>
`;

}else{

result.innerHTML="✅ Plant looks healthy 🌱";

}

}catch(e){

result.innerHTML="⚠️ Network / API Error";

}

}

</script>

</body>
</html>
